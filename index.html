<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Ciberseguridad</title>

        }
        h1 {
            color: #ff3333;

        }
        p {
            color: #aaaaaa;

            line-height: 1.6;
        }
        .btn-test {
            background-color: #ff3333;
            color: white;
