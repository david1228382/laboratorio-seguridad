<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECTOR 666 - YOU ARE AN IDIOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .capa-interfaz {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ff0000;
        }

        .btn-iniciar {
            padding: 15px 35px;
            font-size: 1.3rem;
            background-color: #500;
            color: #fff;
            border: 2px solid #ff0000;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 25px #ff0000;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Jumpscare Satánico Integrado */
        #jumpscareContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .momo-svg {
            width: 85vw;
            height: 85vh;
            filter: contrast(300%) drop-shadow(0 0 50px #ff0000);
            animation: zoomSatanico 0.05s infinite alternate;
        }

        .shake {
            animation: sacudidaInfernal 0.03s infinite alternate, flashSanguineo 0.08s infinite;
        }

        @keyframes zoomSatanico {
            0% { transform: scale(1); }
            100% { transform: scale(1.35) rotate(2deg); }
        }

        @keyframes sacudidaInfernal {
            0% { transform: translate(25px, 25px); }
            100% { transform: translate(-25px, -25px); }
        }

        @keyframes flashSanguineo {
            0% { background-color: #000; }
            50% { background-color: #800; }
            100% { background-color: #000; }
        }

        /* Contenedor Idiot Satánico */
        .contenedor-idiot {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .caritas-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .carita-diablo {
            width: 90px;
            height: 90px;
            animation: parpadeoSatanico 0.08s infinite alternate;
        }

        .alerta-texto {
            font-size: 2.8rem;
            color: #ff0000;
            font-weight: bold;
            text-shadow: 0 0 10px #8b0000, 0 0 25px #ff0000;
            animation: parpadeoSatanico 0.08s infinite alternate;
            letter-spacing: 3px;
        }

        @keyframes parpadeoSatanico {
            0% { filter: invert(0) drop-shadow(0 0 20px #ff0000); transform: scale(1); }
            100% { filter: invert(1) hue-rotate(180deg); transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="capa-interfaz">
        <h1 id="titulo" style="text-shadow: 0 0 20px #ff0000;">SECTOR 666</h1>
        <p id="subtitulo">PRESIONA PARA INICIAR EL RITUAL...</p>
        <button class="btn-iniciar" id="btnBoton" onclick="activarBroma()">INICIAR</button>
        
        <div class="contenedor-idiot" id="contenedorBroma">
            <div class="caritas-container">
                <svg class="carita-diablo" viewBox="0 0 100 100">
                    <path d="M 15 35 Q 0 -5 35 15 Z" fill="#ff0000" />
                    <path d="M 85 35 Q 100 -5 65 15 Z" fill="#ff0000" />
                    <circle cx="50" cy="55" r="40" fill="#000" stroke="#ff0000" stroke-width="5" />
                    <circle cx="35" cy="45" r="7" fill="#ff0000" />
                    <circle cx="65" cy="45" r="7" fill="#ff0000" />
                    <path d="M 25 70 Q 50 40 75 70 Z" fill="#ff0000" />
                </svg>
                <svg class="carita-diablo" viewBox="0 0 100 100">
                    <path d="M 15 35 Q 0 -5 35 15 Z" fill="#ff0000" />
                    <path d="M 85 35 Q 100 -5 65 15 Z" fill="#ff0000" />
                    <circle cx="50" cy="55" r="40" fill="#000" stroke="#ff0000" stroke-width="5" />
                    <circle cx="35" cy="45" r="7" fill="#ff0000" />
                    <circle cx="65" cy="45" r="7" fill="#ff0000" />
                    <path d="M 25 70 Q 50 40 75 70 Z" fill="#ff0000" />
                </svg>
                <svg class="carita-diablo" viewBox="0 0 100 100">
                    <path d="M 15 35 Q 0 -5 35 15 Z" fill="#ff0000" />
                    <path d="M 85 35 Q 100 -5 65 15 Z" fill="#ff0000" />
                    <circle cx="50" cy="55" r="40" fill="#000" stroke="#ff0000" stroke-width="5" />
                    <circle cx="35" cy="45" r="7" fill="#ff0000" />
                    <circle cx="65" cy="45" r="7" fill="#ff0000" />
                    <path d="M 25 70 Q 50 40 75 70 Z" fill="#ff0000" />
                </svg>
            </div>

            <div class="alerta-texto">
                YOU ARE AN IDIOT!<br>HAHAHAHAHA
            </div>
        </div>
    </div>

    <!-- Jumpscare Integrado SVG Satánico -->
    <div id="jumpscareContainer" class="shake">
        <svg class="momo-svg" viewBox="0 0 200 200">
            <!-- Cabeza Espectral -->
            <ellipse cx="100" cy="100" rx="70" ry="85" fill="#000" stroke="#ff0000" stroke-width="4"/>
            <!-- Ojos Abultados Siniestros -->
            <circle cx="65" cy="85" r="28" fill="#fff" stroke="#ff0000" stroke-width="3"/>
            <circle cx="135" cy="85" r="28" fill="#fff" stroke="#ff0000" stroke-width="3"/>
            <circle cx="65" cy="85" r="8" fill="#000"/>
            <circle cx="135" cy="85" r="8" fill="#000"/>
            <circle cx="68" cy="82" r="3" fill="#ff0000"/>
            <circle cx="138" cy="82" r="3" fill="#ff0000"/>
            <!-- Sonrisa Macabra Extendida de Momo -->
            <path d="M 20 125 Q 100 185 180 125" fill="none" stroke="#ff0000" stroke-width="6"/>
            <path d="M 25 125 Q 100 160 175 125" fill="#000"/>
            <path d="M 20 120 L 35 130 M 180 120 L 165 130" stroke="#ff0000" stroke-width="4"/>
        </svg>
    </div>

    <audio id="audioMp3" loop preload="auto">
        <source src="idiot.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function ajustarTamano() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        ajustarTamano();
        window.addEventListener('resize', ajustarTamano);

        const simbolos = '☠⛧⸸666⸸⛧☠︎ABCDEFGHIJKLMOPQRSTUVWXYZ@#$%&*()';
        const tamanoFuente = 18;
        let columnas = Math.floor(canvas.width / tamanoFuente);
        let gotas = Array(columnas).fill(1);

        function renderMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff0000';
            ctx.font = tamanoFuente + 'px monospace';

            for (let i = 0; i < gotas.length; i++) {
                const char = simbolos[Math.floor(Math.random() * simbolos.length)];
                ctx.fillText(char, i * tamanoFuente, gotas[i] * tamanoFuente);

                if (gotas[i] * tamanoFuente > canvas.height && Math.random() > 0.96) {
                    gotas[i] = 0;
                }
                gotas[i]++;
            }
        }

        setInterval(renderMatrix, 30);

        function activarBroma() {
            const audioIdiot = document.getElementById('audioMp3');
            audioIdiot.play().catch(e => console.log(e));

            document.getElementById('btnBoton').style.display = 'none';
            document.getElementById('titulo').style.display = 'none';
            document.getElementById('subtitulo').innerText = "INVOCANDO... 666";

            setTimeout(() => {
                const jumpscare = document.getElementById('jumpscareContainer');
                jumpscare.style.display = 'flex';

                setTimeout(() => {
                    jumpscare.style.display = 'none';
                    document.getElementById('subtitulo').style.display = 'none';
                    document.getElementById('contenedorBroma').style.display = 'flex';
                }, 1600);

            }, 2500);
        }
    </script>
</body>
</html>
