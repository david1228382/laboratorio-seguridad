<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Seguridad</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            text-align: center;
        }

        .contenedor {
            padding: 20px;
        }

        .btn-iniciar {
            padding: 15px 30px;
            font-size: 1.2em;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 50px;
        }

        /* Estilos cuando la pantalla se bloquea */
        body.bloqueado {
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
            height: 100% !important;
            touch-action: none !important;
            pointer-events: none !important;
            background-color: #000 !important;
        }

        .alerta {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: 2em;
            font-weight: bold;
            z-index: 9999;
            width: 90%;
        }
    </style>
</head>
<body>

    <div class="contenedor" id="contenido">
        <h1>Laboratorio de Seguridad</h1>
        <p>Presiona el botón para cargar el contenido del laboratorio.</p>
        <button class="btn-iniciar" onclick="iniciarPrueba()">Cargar Contenido</button>
        
        <div style="height: 1500px; background: linear-gradient(#222, #444); margin-top: 30px;">
            <p style="padding-top: 20px;">Desplázate hacia abajo...</p>
        </div>
    </div>

    <div id="mensajeAlerta" class="alerta">
        ⚠️ ¡SISTEMA BLOQUEADO! ⚠️
        <p style="font-size: 0.6em; color: white; margin-top: 10px;">Fuiste hackeado</p>
    </div>

    <script>
        function prevenirScroll(e) {
            e.preventDefault();
        }

        function hablar() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Limpiar lecturas pendientes
                const mensaje = new SpeechSynthesisUtterance("Fuiste hackeado");
                mensaje.lang = 'es-ES';
                mensaje.rate = 0.8;
                mensaje.pitch = 0.7;
                window.speechSynthesis.speak(mensaje);
            }
        }

        function sonarSiren() {
            // Generar tono de alarma sintetizado
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        function iniciarPrueba() {
            alert("Cargando laboratorio...");
            
            setTimeout(() => {
                // 1. Bloquear desplazamiento y pantalla
                document.body.classList.add('bloqueado');
                window.addEventListener('touchmove', prevenirScroll, { passive: false });
                window.addEventListener('wheel', prevenirScroll, { passive: false });
                
                // 2. Ejecutar sonido y voz
                sonarSiren();
                hablar();

                // 3. Mostrar alerta visual
                document.getElementById('contenido').style.display = 'none';
                document.getElementById('mensajeAlerta').style.display = 'block';
            }, 3000);
        }
    </script>
</body>
</html>
