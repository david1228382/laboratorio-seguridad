<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laboratorio Matrix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #0f0;
        }

        .btn-start {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #0f0;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 15px #0f0;
            margin-top: 20px;
        }

        .mensaje-idiot {
            display: none;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            animation: blink 0.4s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.3; transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="overlay">
        <h1 id="titulo">SISTEMA MATRIX</h1>
        <p id="subtitulo">Presiona para conectar al servidor...</p>
        <button class="btn-start" id="btnIniciar" onclick="iniciarEfecto()">CONECTAR</button>
        <div class="mensaje-idiot" id="mensajeIdiot">
            YOU ARE AN IDIOT!<br>HAHAHAHAHA
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%';
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);

        function reproducirAudioBucle() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const hablar = () => {
                    const mensaje = new SpeechSynthesisUtterance("You are an idiot, ha ha ha ha ha");
                    mensaje.lang = 'en-US';
                    mensaje.rate = 1.1;
                    mensaje.pitch = 1.2;
                    
                    mensaje.onend = () => {
                        setTimeout(hablar, 100);
                    };

                    window.speechSynthesis.speak(mensaje);
                };

                hablar();
            }
        }

        function iniciarEfecto() {
            document.getElementById('btnIniciar').style.display = 'none';
            document.getElementById('titulo').style.display = 'none';
            document.getElementById('subtitulo').innerText = "Cargando...";

            setTimeout(() => {
                document.getElementById('subtitulo').style.display = 'none';
                document.getElementById('mensajeIdiot').style.display = 'block';
                reproducirAudioBucle();
            }, 3000);
        }
    </script>
</body>
</html>
