<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Seguridad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #111;
            color: #fff;
        }

        /* Clase para congelar la pantalla */
        .bloqueado {
            overflow: hidden !important;
            touch-action: none !important;
            pointer-events: none !important;
        }

        .alerta {
            display: none;
            margin-top: 50px;
            color: #ff0000;
            font-size: 2em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Página de Prueba</h1>
    <p>Navega normalmente por el contenido...</p>
    
    <!-- Contenido largo para probar el bloqueo del scroll -->
    <div style="height: 1500px; background: linear-gradient(#222, #444); margin-top: 20px;">
        <p style="padding-top: 50px;">Desplázate hacia abajo...</p>
    </div>

    <div id="mensajeAlerta" class="alerta">
        ⚠️ ¡SISTEMA BLOQUEADO! ⚠️
    </div>

    <script>
        // Función que ejecuta el audio mediante síntesis de voz
        function decirMensaje(texto) {
            if ('speechSynthesis' in window) {
                const mensaje = new SpeechSynthesisUtterance(texto);
                mensaje.lang = 'es-ES';
                mensaje.rate = 0.9; // Velocidad un poco más lenta para dar efecto
                mensaje.pitch = 0.8; // Tono más grave
                window.speechSynthesis.speak(mensaje);
            }
        }

        // Temporizador de 3 segundos (3000 ms)
        setTimeout(() => {
            // 1. Bloquear el scroll y la interacción en la pantalla
            document.body.classList.add('bloqueado');
            document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
            document.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });

            // 2. Reproducir el sonido por voz
            decirMensaje("Fuiste hackeado");

            // 3. Mostrar la alerta en pantalla
            document.getElementById('mensajeAlerta').style.display = 'block';
        }, 3000);
    </script>
</body>
</html>
