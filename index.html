<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA MATRIX - YOU ARE AN IDIOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .capa-interfaz {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #0f0;
        }

        .btn-iniciar {
            padding: 15px 35px;
            font-size: 1.3rem;
            background-color: #0f0;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 15px #0f0;
            margin-top: 20px;
        }

        .contenedor-idiot {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .caritas-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .carita-diablo {
            width: 80px;
            height: 80px;
            animation: parpadeoColor 0.15s infinite alternate;
        }

        .alerta-texto {
            font-size: 2.5rem;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            animation: parpadeoColor 0.15s infinite alternate;
        }

        @keyframes parpadeoColor {
            0% { filter: invert(0); transform: scale(1); }
            100% { filter: invert(1); transform: scale(1.08); }
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="capa-interfaz">
        <h1 id="titulo">SISTEMA MATRIX</h1>
        <p id="subtitulo">Presiona el botón para conectar...</p>
        <button class="btn-iniciar" id="btnBoton" onclick="activarBroma()">INICIAR</button>
        
        <div class="contenedor-idiot" id="contenedorBroma">
            <div class="caritas-container">
                <svg class="carita-diablo" viewBox="0 0 100 100">
                    <path d="M 20 30 Q 10 5 35 20 Z" fill="#fff" />
                    <path d="M 80 30 Q 90 5 65 20 Z" fill="#fff" />
                    <circle cx="50" cy="55" r="40" fill="#fff" stroke="#000" stroke-width="4" />
                    <circle cx="35" cy="45" r="6" fill="#000" />
                    <circle cx="65" cy="45" r="6" fill="#000" />
                    <path d="M 25 60 Q 50 85 75 60 Z" fill="#000" />
                </svg>
                <svg class="carita-diablo" viewBox="0 0 100 100">
                    <path d="M 20 30 Q 10 5 35 20 Z" fill="#fff" />
                    <path d="M 80 30 Q 90 5 65 20 Z" fill="#fff" />
                    <circle cx="50" cy="55" r="40" fill="#fff" stroke="#000" stroke-width="4" />
                    <circle cx="35" cy="45" r="6" fill="#000" />
                    <circle cx="65" cy="45" r="6" fill="#000" />
                    <path d="M 25 60 Q 50 85 75 60 Z" fill="#000" />
                </svg>
                <svg class="carita-diablo" viewBox="0 0 100 100">
                    <path d="M 20 30 Q 10 5 35 20 Z" fill="#fff" />
                    <path d="M 80 30 Q 90 5 65 20 Z" fill="#fff" />
                    <circle cx="50" cy="55" r="40" fill="#fff" stroke="#000" stroke-width="4" />
                    <circle cx="35" cy="45" r="6" fill="#000" />
                    <circle cx="65" cy="45" r="6" fill="#000" />
                    <path d="M 25 60 Q 50 85 75 60 Z" fill="#000" />
                </svg>
            </div>

            <div class="alerta-texto">
                YOU ARE AN IDIOT!<br>HAHAHAHAHA
            </div>
        </div>
    </div>

    <script>
        // Matrix Lluvia
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function ajustarTamano() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        ajustarTamano();
        window.addEventListener('resize', ajustarTamano);

        const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const tamanoFuente = 16;
        let columnas = Math.floor(canvas.width / tamanoFuente);
        let gotas = Array(columnas).fill(1);

        function renderMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = tamanoFuente + 'px monospace';

            for (let i = 0; i < gotas.length; i++) {
                const char = letras[Math.floor(Math.random() * letras.length)];
                ctx.fillText(char, i * tamanoFuente, gotas[i] * tamanoFuente);

                if (gotas[i] * tamanoFuente > canvas.height && Math.random() > 0.975) {
                    gotas[i] = 0;
                }
                gotas[i]++;
            }
        }

        setInterval(renderMatrix, 33);

        // Generador de audio de la melodía original "You are an idiot"
        let actx;

        function sonarSintetizador(frecuencia, duracion, tiempoInicio) {
            setTimeout(() => {
                if (!actx) return;
                try {
                    const osc = actx.createOscillator();
                    const gain = actx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(frecuencia, actx.currentTime);
                    gain.gain.setValueAtTime(0.4, actx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duracion);
                    osc.connect(gain);
                    gain.connect(actx.destination);
                    osc.start();
                    osc.stop(actx.currentTime + duracion);
                } catch(e) {}
            }, tiempoInicio);
        }

        function reproducirAudioBucle() {
            // Frecuencias exactas de las notas de la canción
            const secuencia = [
                {f: 261.63, d: 0.25, t: 0},     // You
                {f: 329.63, d: 0.25, t: 250},   // are
                {f: 392.00, d: 0.25, t: 500},   // an
                {f: 523.25, d: 0.40, t: 750},   // idiot!
                {f: 392.00, d: 0.15, t: 1250},  // ha
                {f: 329.63, d: 0.15, t: 1450},  // ha
                {f: 392.00, d: 0.15, t: 1650},  // ha
                {f: 329.63, d: 0.15, t: 1850},  // ha
                {f: 261.63, d: 0.35, t: 2050}   // ha
            ];

            secuencia.forEach(nota => sonarSintetizador(nota.f, nota.d, nota.t));

            // Disparar síntesis de voz en inglés
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const voz = new SpeechSynthesisUtterance("You are an idiot, ha ha ha ha ha");
                voz.lang = 'en-US';
                voz.rate = 1.15;
                voz.pitch = 1.2;
                window.speechSynthesis.speak(voz);
            }

            setTimeout(reproducirAudioBucle, 2600);
        }

        function activarBroma() {
            // Inicialización de la API de Audio al hacer clic
            actx = new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === 'suspended') {
                actx.resume();
            }

            document.getElementById('btnBoton').style.display = 'none';
            document.getElementById('titulo').style.display = 'none';
            document.getElementById('subtitulo').innerText = "Cargando acceso...";

            setTimeout(() => {
                document.getElementById('subtitulo').style.display = 'none';
                document.getElementById('contenedorBroma').style.display = 'flex';
                reproducirAudioBucle();
            }, 3000);
        }
    </script>
</body>
</html>
